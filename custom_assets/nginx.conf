map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 20M;

    location = /install-agent.sh {
        alias /var/www/packaging/install-agent.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /install.sh {
        alias /var/www/packaging/install-agent.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/assets/beszel-agent_(x86_64|arm64)\.tar\.gz$ {
        alias /var/www/custom_assets/beszel-agent_$1.tar.gz;
        default_type application/gzip;
        add_header Cache-Control "max-age=86400";
    }

    location = /assets/security-ui.css {
        alias /var/www/custom_assets/security-ui.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    location = /assets/security-ui.js {
        alias /var/www/custom_assets/security-ui.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://beszel:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        sub_filter '</head>' '<link rel="stylesheet" href="/assets/security-ui.css"><script type="module" src="/assets/security-ui.js"></script></head>';
        sub_filter_once on;
    }
}
