map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 20M;

    location = /install-agent.sh {
        alias /var/www/custom_assets/install-agent.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /install.sh {
        alias /var/www/custom_assets/install-agent.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location = /assets/beszel-daily-audit.py {
        alias /var/www/custom_assets/beszel-daily-audit.py;
        default_type text/x-python;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/assets/beszel-agent_(x86_64|arm64)\.tar\.gz$ {
        alias /var/www/custom_assets/beszel-agent_$1.tar.gz;
        default_type application/gzip;
        add_header Cache-Control "max-age=86400";
    }

    location = /assets/security-ui.css {
        alias /var/www/custom_assets/security-ui.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }

    location = /assets/footer-repo-link-DLprW6cJ.js {
        alias /var/www/custom_assets/footer-repo-link-DLprW6cJ.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /assets/security-ui.js {
        alias /var/www/custom_assets/security-ui.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # --- Security API ---------------------------------------------------
    # Agents push reports and events with their own X-Beszel-Security-Token,
    # checked by the security hub. Only POST is allowed here, so these two
    # paths can't be used to read data without logging in.
    location = /api/security-report {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /api/security-event {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Everything else (reading reports, ports, services, updates, rollback,
    # fail2ban) needs a logged-in Beszel user. nginx asks PocketBase to
    # refresh the token from the Authorization header: 200 lets the request
    # through, 401 blocks it.
    location ^~ /api/security- {
        auth_request /_bszl_auth;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location = /_bszl_auth {
        internal;
        proxy_pass http://127.0.0.1:8091/api/collections/users/auth-refresh;
        proxy_method POST;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        sub_filter '</head>' '<link rel="stylesheet" href="/assets/security-ui.css?v=40"><script type="module" src="/assets/security-ui.js?v=40"></script></head>';
        sub_filter '"HUB_VERSION":"0.21.0"' '"HUB_VERSION":"0.0.1"';
        sub_filter_once off;
    }
}
